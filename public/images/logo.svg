  <!-- horizon / grill bars -->
  <path d="M52 118h96" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <path d="M62 126h76M72 134h56" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- flame -->
  <path d="M100 150c-8-5-10-12-6-19 1 5 4 7 6 7-1-6 2-12 8-15-2 6 2 10 2 15 0 6-4 10-10 12z" fill="url(#gold)"/>
